name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  WORKING_DIRECTORY: 'frontend/bluesphere-site'

jobs:
  # Quality checks job - runs on all branches and PRs
  test:
    name: 'Quality Checks'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIRECTORY }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: TypeScript type checking
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run type-check

      - name: ESLint code analysis
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run lint

      - name: Build test
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run build

      - name: Run E2E tests (if available)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
            npx playwright install --with-deps chromium
            npm run test:e2e
          else
            echo "No E2E tests configured"
          fi
        continue-on-error: true

  # Build job - only for master branch and workflow_dispatch
  build:
    name: 'Build for Production'
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    outputs:
      build-successful: ${{ steps.build-check.outputs.success }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIRECTORY }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Build and export application
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run build

      - name: Verify build output
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          ls -la out/
          if [ ! -f "out/index.html" ]; then
            echo "Error: index.html not found in output"
            exit 1
          fi
          echo "✅ Build output verified successfully"

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WORKING_DIRECTORY }}/out
          name: github-pages

      - id: build-check
        run: echo "success=true" >> $GITHUB_OUTPUT

  # Deploy job - only runs after successful build
  deploy:
    name: 'Deploy to GitHub Pages'
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.build-successful == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "Deployed at: $(date -u)" >> $GITHUB_STEP_SUMMARY